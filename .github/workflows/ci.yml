name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          # These jobs never launch the desktop app, so skip Electron's large binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run check:ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          # These jobs never launch the desktop app, so skip Electron's large binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web
          path: playwright-report
          retention-days: 7

  # The desktop app only ships for Windows, so its tests run there against the real Electron binary.
  e2e-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Package first, then test the packaged app: it reads its files out of app.asar, which the dev tree does not.
      - run: npm run dist
      - run: npm run test:e2e:packaged
        env:
          OPEN_TOOLS_EXE: release/win-unpacked/Open Tools.exe
      - uses: actions/upload-artifact@v4
        with:
          name: open-tools-windows
          path: |
            release/Open-Tools-Setup.exe
            release/Open-Tools-Portable.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-desktop
          path: playwright-report
          retention-days: 7

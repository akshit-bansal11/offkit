name: CI

on:
  push:
    branches: [main, "feat/**", "wip/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native Rust + Slint crate. Runs on every branch; wip/** pushes only touch desktop/.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      # Chocolatey shims ffmpeg.exe and ffprobe.exe into its bin dir, already on PATH; the media tests skip without them.
      - run: choco install ffmpeg -y --no-progress
      - name: Fetch pdfium (when the script exists)
        if: hashFiles('desktop/scripts/fetch-pdfium.ps1') != ''
        shell: pwsh
        working-directory: desktop
        run: ./scripts/fetch-pdfium.ps1
      - run: cargo fmt --check
        working-directory: desktop
      # `cargo fmt` skips modules declared inside the `tools!` macro, so format every tracked file directly.
      - name: rustfmt the macro-declared tool modules
        shell: bash
        working-directory: desktop
        run: |
          rustfmt --edition 2024 $(git ls-files 'src/*.rs' 'src/**/*.rs')
          if ! git diff --quiet; then
            git diff > rustfmt.patch
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rustfmt-patch
          path: desktop/rustfmt.patch
          if-no-files-found: ignore
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop
      # Nobody can run cargo locally, so CI is where Cargo.lock gets regenerated.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-lock
          path: desktop/Cargo.lock

  check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/native-app' || startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  e2e-web:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/native-app' || startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-web
          path: playwright-report
          retention-days: 7
      # e2e/ui-sweep.spec.ts screenshots every tool page; kept to review the UI.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-sweep
          path: ui-sweep
          retention-days: 7
          if-no-files-found: ignore

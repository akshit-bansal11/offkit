# cargo-about config for the third-party notices shipped with every installer
# (release.yml renders desktop/packaging/about.hbs into resources/THIRD-PARTY-NOTICES.html).
# A crate under a licence missing from this list fails the release build instead of shipping unlisted.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "bzip2-1.0.6",
    "NCSA",
    # Slint is GPL-3.0, royalty-free or commercial. Offkit takes the royalty-free licence, whose
    # attribution condition the About sheet meets (AboutSlint). cargo-about has no text for a
    # LicenseRef, so release.yml ships Slint's own file as slint-LICENSE.md.
    "LicenseRef-Slint-Royalty-free-2.0",
]
# Offkit itself is `publish = false` and not a third party.
private = { ignore = true }

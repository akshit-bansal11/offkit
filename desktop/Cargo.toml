[package]
name = "open-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "open-tools"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
rfd = "=0.17.2"
window-vibrancy = "=0.8.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
anyhow = "=1.0.104"
# Already in the tree via Slint's image loader; used only by the snapshot hook.
png = "=0.18.1"
open = "=5.4.4"

[build-dependencies]
slint-build = "=1.18.1"

# Debug builds stay fast to compile; release trades build time for size and speed.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
